name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  tests:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Python syntax
        run: |
          python -m py_compile api/*.py src/**/*.py tests/*.py
      
      - name: Run unit tests
        env:
          FIRESTORE_EMULATOR_HOST: "localhost:8080"
        run: |
          pytest tests/ -v --tb=short --cov=api --cov=src --cov-report=xml
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
  
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: bandit -r api/ src/ -f json -o bandit-report.json || true
      
      - name: Check for vulnerable dependencies
        run: safety check --json || true
  
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort
      
      - name: Check code formatting (black)
        run: black --check api/ src/ tests/ || true
      
      - name: Check import sorting (isort)
        run: isort --check-only api/ src/ tests/ || true
      
      - name: Run Flake8
        run: flake8 api/ src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
  
  build:
    name: Build Docker Image
    needs: [tests, security, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build summary
        run: |
          echo "## ✅ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Security: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: PASSED" >> $GITHUB_STEP_SUMMARY
