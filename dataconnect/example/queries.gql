# dataconnect/example/queries.gql
query ListRequests @auth(level: PUBLIC) {
  requests {
    id
    text
  }
}

query ListAllData @auth(level: PUBLIC) {
  requests(limit: 10000) {
    id
    text
    keyword
    location
    target
    eventTimestamp
    createdAt
  }
  predictions(limit: 10000) {
    id
    requestId
    disaster
    confidence
    source
    createdAt
  }
}
